<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio — Bogaturev Design</title>

    <meta
        name="description"
        content="Selected graphic design, packaging, branding, print design and prepress projects by Bogaturev Design."
    >

    <link rel="canonical" href="https://bogaturevdesign.com/portfolio/portfolio.html">

    <link rel="stylesheet" href="portfolio.css">
</head>

<body>
<!-- ==================================================
     КНОПКА НАЗАД НА ГЛАВНУЮ
================================================== -->

<a href="https://bogaturevdesign.com/" class="portfolio-back" aria-label="Back to Home">
    <span class="portfolio-back-arrow">←</span>
    <span class="portfolio-back-text">Home</span>
</a>

<style>
/* ==================================================
   PORTFOLIO BACK BUTTON
================================================== */

.portfolio-back {
    position: fixed;

    left: 30px;
    top: 30px;

    z-index: 1000;

    display: inline-flex;
    align-items: center;
    gap: 9px;

    padding: 10px 15px;

    color: #999;
    text-decoration: none;

    font-size: 13px;
    font-weight: 600;

    border: 1px solid #292929;
    border-radius: 999px;

    background: rgba(11, 11, 11, 0.75);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    transition:
        color 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease;
}

.portfolio-back-arrow {
    font-size: 17px;
    line-height: 1;

    transition:
        transform 0.25s ease;
}

.portfolio-back-text {
    line-height: 1;
}

.portfolio-back:hover {
    color: #fff;

    border-color: #444;

    background: rgba(25, 25, 25, 0.9);
}

.portfolio-back:hover .portfolio-back-arrow {
    transform: translateX(-3px);
}

.portfolio-back:active {
    transform: scale(0.97);
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 600px) {

    .portfolio-back {
        left: 18px;
        top: 18px;

        padding: 9px 13px;

        font-size: 12px;
    }

    .portfolio-back-arrow {
        font-size: 16px;
    }
}
</style>

<main class="portfolio">

    <!-- HEADER -->
    <header class="portfolio-header">

        <div class="eyebrow">
            Bogaturev Design / Selected Works
        </div>

        <h1>Portfolio</h1>

        <p class="portfolio-description">
            Graphic design, packaging, branding, print design and prepress projects.
        </p>

    </header>


    <!-- FILTERS -->
    <nav class="portfolio-filters" aria-label="Portfolio categories">

        <button class="filter-button active" data-filter="all">
            All
        </button>

        <button class="filter-button" data-filter="packaging">
            Packaging
        </button>

        <button class="filter-button" data-filter="branding">
            Branding
        </button>

        <button class="filter-button" data-filter="graphic">
            Graphic Design
        </button>

        <button class="filter-button" data-filter="prepress">
            Prepress
        </button>

    </nav>


    <!-- PROJECTS -->
    <section
        class="projects-grid"
        id="projectsGrid"
        aria-label="Portfolio projects"
    ></section>

</main>


<script src="projects.js"></script>
<script src="portfolio.js"></script>

</body>
</html>
