<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>Портфоліо графічного дизайну | Bogaturev Design</title>

   <meta
    name="description"
    content="Портфоліо Bogaturev Design: проєкти з графічного дизайну, дизайну упаковки, брендингу, поліграфії та додрукарської підготовки."
>

  <link rel="canonical" href="https://bogaturevdesign.com/portfolio/">

    <link rel="stylesheet" href="portfolio.css">
</head>

<body>
<!-- ==================================================
     КНОПКА НАЗАД НА ГЛАВНУЮ
================================================== -->

<a href="https://bogaturevdesign.com/" class="portfolio-back" aria-label="На головну">
    <span class="portfolio-back-arrow">←</span>
   <span class="portfolio-back-text" data-i18n="home">Головна</span>
</a>

<style>
/* ==================================================
   PORTFOLIO BACK BUTTON
================================================== */

.portfolio-back {
    position: fixed;

     left: 50px;
    top: 50px;

    z-index: 1000;

    display: inline-flex;
    align-items: center;
    gap: 19px;

    padding: 22px 34px;

    color: #999;
    text-decoration: none;

    font-size: 26px;
    font-weight: 600;

   border: 2px solid #292929;
    border-radius: 999px;

    background: rgba(11, 11, 11, 0.75);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    transition:
        color 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease;
}

.portfolio-back-arrow {
    font-size: 34px;
    line-height: 1;

    transition:
        transform 0.25s ease;
}

.portfolio-back-text {
    line-height: 1;
}

.portfolio-back:hover {
    color: #fff;

    border-color: #444;

    background: rgba(25, 25, 25, 0.9);
}

.portfolio-back:hover .portfolio-back-arrow {
    transform: translateX(-6px);
}

.portfolio-back:active {
    transform: scale(0.97);
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 600px) {

    .portfolio-back {
        left: 18px;
        top: 18px;

        padding: 9px 13px;

        font-size: 12px;
    }

    .portfolio-back-arrow {
        font-size: 16px;
    }
}
</style>

<main class="portfolio">

    <!-- HEADER -->
    <header class="portfolio-header">

    <div class="eyebrow" data-i18n="selectedWorks">
        Bogaturev Design / Вибрані роботи
    </div>

    <h1 data-i18n="portfolio">
        Портфоліо
    </h1>

    <p class="portfolio-description" data-i18n="portfolioDescription">
        Проєкти з графічного дизайну, дизайну упаковки, брендингу, поліграфії та додрукарської підготовки.
    </p>

</header>


    <!-- FILTERS -->
    <nav class="portfolio-filters" aria-label="Portfolio categories">

        <button class="filter-button active" data-filter="all">
            All
        </button>

        <button class="filter-button" data-filter="packaging">
            Packaging
        </button>

        <button class="filter-button" data-filter="branding">
            Branding
        </button>

        <button class="filter-button" data-filter="graphic">
            Graphic Design
        </button>

        <button class="filter-button" data-filter="prepress">
            Prepress
        </button>
        <button class="filter-button" data-filter="logo">
            Logo Design
        </button>

    </nav>


    <!-- PROJECTS -->
    <section
        class="projects-grid"
        id="projectsGrid"
        aria-label="Portfolio projects"
    ></section>

</main>


<script src="portfolio-translations.js"></script>
<script src="portfolio-i18n.js"></script>
<script src="projects.js"></script>
<script src="portfolio.js"></script>

</body>
</html>
